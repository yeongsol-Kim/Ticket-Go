apiVersion: 1

# /etc/dashboards 에 있는 JSON 대시보드를 자동 로드
providers:
  - name: 'ticketgo'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/dashboards
      foldersFromFilesStructure: false
