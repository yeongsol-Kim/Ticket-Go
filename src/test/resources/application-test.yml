# 테스트 환경 설정
spring:
  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Redis (Testcontainers 또는 Mock에서 설정)
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka 비활성화 (테스트 시)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# JWT 설정
ticketgo:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-testing
    expiration-ms: 86400000

# Logging
logging:
  level:
    com.yeongsol.ticketgo: DEBUG
    org.hibernate.SQL: DEBUG
