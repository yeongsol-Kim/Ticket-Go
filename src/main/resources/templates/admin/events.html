<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketGo Admin - 이벤트 관리</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 1.5rem; }
        .navbar span { background: #dc2626; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-left: 0.5rem; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header h2 { font-size: 1.5rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; text-decoration: none; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.875rem; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-success { background: #059669; color: white; }
        .btn-warning { background: #d97706; color: white; }
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .alert-success { background: #d1fae5; color: #059669; }
        .alert-error { background: #fee2e2; color: #dc2626; }
        table { width: 100%; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-collapse: collapse; overflow: hidden; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        tr:last-child td { border-bottom: none; }
        .status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .status-ON_SALE { background: #d1fae5; color: #059669; }
        .status-DRAFT { background: #e5e7eb; color: #6b7280; }
        .status-SOLD_OUT { background: #fee2e2; color: #dc2626; }
        .status-CANCELLED { background: #fef3c7; color: #d97706; }
        .status-COMPLETED { background: #dbeafe; color: #2563eb; }
        .actions { display: flex; gap: 0.5rem; }
        .actions form { display: inline; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div>
            <h1>TicketGo <span>ADMIN</span></h1>
        </div>
        <div>
            <a href="/admin">대시보드</a>
            <a href="/admin/events">이벤트 관리</a>
            <a href="/">사용자 페이지</a>
            <a href="/logout">로그아웃</a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="header">
            <h2>이벤트 관리</h2>
            <a href="/admin/events/new" class="btn btn-primary">새 이벤트 생성</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>이벤트명</th>
                    <th>공연일시</th>
                    <th>장소</th>
                    <th>가격</th>
                    <th>티켓</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.id}">1</td>
                    <td th:text="${event.name}">이벤트명</td>
                    <td th:text="${#temporals.format(event.startDateTime, 'yyyy-MM-dd HH:mm')}">2024-12-31</td>
                    <td th:text="${event.venue}">장소</td>
                    <td th:text="${#numbers.formatInteger(event.price, 0, 'COMMA')} + '원'">100,000원</td>
                    <td th:text="${event.availableTickets} + ' / ' + ${event.totalTickets}">100/100</td>
                    <td>
                        <span class="status" th:classappend="'status-' + ${event.status.name()}" th:text="${event.status.name()}">ON_SALE</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{/admin/events/{id}/edit(id=${event.id})}" class="btn btn-sm btn-primary">수정</a>
                        <form th:if="${event.status.name() == 'DRAFT'}" th:action="@{/admin/events/{id}/status(id=${event.id})}" method="post" style="display:inline;">
                            <input type="hidden" name="status" value="ON_SALE">
                            <button type="submit" class="btn btn-sm btn-success">판매시작</button>
                        </form>
                        <form th:action="@{/admin/events/{id}/delete(id=${event.id})}" method="post" style="display:inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                            <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${events.isEmpty()}">
                    <td colspan="8" style="text-align: center; color: #6b7280;">등록된 이벤트가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
