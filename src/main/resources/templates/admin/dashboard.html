<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketGo Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 1.5rem; }
        .navbar span { background: #dc2626; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-left: 0.5rem; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #6b7280; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: #1a1a2e; }
        .section-title { font-size: 1.25rem; margin-bottom: 1rem; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
        .menu-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-decoration: none; color: inherit; transition: transform 0.2s; }
        .menu-card:hover { transform: translateY(-4px); }
        .menu-card h3 { margin-bottom: 0.5rem; }
        .menu-card p { color: #6b7280; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div>
            <h1>TicketGo <span>ADMIN</span></h1>
        </div>
        <div>
            <a href="/admin/events">이벤트 관리</a>
            <a href="/">사용자 페이지</a>
            <a href="/logout">로그아웃</a>
        </div>
    </nav>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3>총 이벤트</h3>
                <p class="value" th:text="${totalEvents}">0</p>
            </div>
            <div class="stat-card">
                <h3>판매중</h3>
                <p class="value" th:text="${onSaleEvents}">0</p>
            </div>
        </div>

        <h2 class="section-title">관리 메뉴</h2>
        <div class="menu-grid">
            <a href="/admin/events" class="menu-card">
                <h3>이벤트 관리</h3>
                <p>이벤트 생성, 수정, 삭제 및 상태 관리</p>
            </a>
            <a href="/admin/events/new" class="menu-card">
                <h3>새 이벤트 생성</h3>
                <p>새로운 이벤트를 등록합니다</p>
            </a>
        </div>
    </div>
</body>
</html>
