<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketGo - 예매</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 2rem; }
        .navbar h1 { font-size: 1.5rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .booking-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .event-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; }
        .event-header h2 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        .event-header p { opacity: 0.9; }
        .booking-body { padding: 2rem; }
        .info-row { display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #e5e7eb; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #6b7280; }
        .info-value { font-weight: 500; }
        .ticket-selector { margin: 2rem 0; padding: 1.5rem; background: #f9fafb; border-radius: 8px; }
        .ticket-selector h3 { margin-bottom: 1rem; }
        .quantity-control { display: flex; align-items: center; gap: 1rem; }
        .quantity-btn { width: 40px; height: 40px; border: 1px solid #d1d5db; border-radius: 8px; background: white; font-size: 1.25rem; cursor: pointer; }
        .quantity-btn:hover { background: #f3f4f6; }
        .quantity-input { width: 60px; text-align: center; font-size: 1.25rem; border: 1px solid #d1d5db; border-radius: 8px; padding: 0.5rem; }
        .total-section { background: #1a1a2e; color: white; padding: 1.5rem; margin: 0 -2rem -2rem; }
        .total-row { display: flex; justify-content: space-between; align-items: center; }
        .total-label { font-size: 1.25rem; }
        .total-price { font-size: 2rem; font-weight: bold; }
        .btn { display: inline-block; width: 100%; padding: 1rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; text-align: center; margin-top: 1rem; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .alert { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
        .alert-error { background: #fee2e2; color: #dc2626; }
        .timer { background: #fef3c7; color: #d97706; padding: 0.75rem 1rem; border-radius: 8px; text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>TicketGo</h1>
    </nav>

    <div class="container">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="timer">
            예매 제한 시간: <strong id="timer">10:00</strong>
        </div>

        <div class="booking-card">
            <div class="event-header">
                <h2 th:text="${event.name}">이벤트명</h2>
                <p th:text="${event.venue}">장소</p>
            </div>
            <div class="booking-body">
                <div class="info-row">
                    <span class="info-label">공연 일시</span>
                    <span class="info-value" th:text="${#temporals.format(event.startDateTime, 'yyyy년 MM월 dd일 HH:mm')}">2024년 12월 31일 19:00</span>
                </div>
                <div class="info-row">
                    <span class="info-label">티켓 가격</span>
                    <span class="info-value" th:text="${#numbers.formatInteger(event.price, 0, 'COMMA')} + '원'">50,000원</span>
                </div>
                <div class="info-row">
                    <span class="info-label">잔여 티켓</span>
                    <span class="info-value" th:text="${event.availableTickets} + '장'">100장</span>
                </div>

                <form action="#" th:action="@{/events/{id}/booking(id=${event.id})}" method="post">
                    <div class="ticket-selector">
                        <h3>티켓 수량 선택</h3>
                        <div class="quantity-control">
                            <button type="button" class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                            <input type="number" name="ticketCount" id="ticketCount" class="quantity-input" value="1" min="1" max="4" readonly>
                            <button type="button" class="quantity-btn" onclick="changeQuantity(1)">+</button>
                            <span style="color: #6b7280; margin-left: 1rem;">최대 4매</span>
                        </div>
                    </div>

                    <div class="total-section">
                        <div class="total-row">
                            <span class="total-label">총 결제금액</span>
                            <span class="total-price" id="totalPrice" th:data-price="${event.price}">
                                <span th:text="${#numbers.formatInteger(event.price, 0, 'COMMA')}">50,000</span>원
                            </span>
                        </div>
                        <button type="submit" class="btn btn-primary">결제하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const price = parseInt(document.getElementById('totalPrice').dataset.price);

        function changeQuantity(delta) {
            const input = document.getElementById('ticketCount');
            let value = parseInt(input.value) + delta;
            if (value < 1) value = 1;
            if (value > 4) value = 4;
            input.value = value;
            updateTotal();
        }

        function updateTotal() {
            const quantity = parseInt(document.getElementById('ticketCount').value);
            const total = price * quantity;
            document.getElementById('totalPrice').innerHTML =
                total.toLocaleString() + '원';
        }

        // 타이머 - 서버의 결제 세션 남은 시간 기준
        let timeLeft = /*[[${remainingSeconds}]]*/ 600;
        setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) {
                alert('예매 시간이 만료되었습니다.');
                location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
