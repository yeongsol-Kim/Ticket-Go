<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketGo - 예매 완료</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 2rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        .success-box { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; padding: 3rem 2rem; }
        .success-icon { width: 80px; height: 80px; background: #d1fae5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .success-icon svg { width: 40px; height: 40px; color: #059669; }
        .success-title { font-size: 1.75rem; margin-bottom: 0.5rem; }
        .success-subtitle { color: #6b7280; margin-bottom: 2rem; }
        .ticket-info { background: #f9fafb; border-radius: 8px; padding: 1.5rem; margin: 1.5rem 0; text-align: left; }
        .info-row { display: flex; justify-content: space-between; padding: 0.5rem 0; }
        .info-label { color: #6b7280; }
        .info-value { font-weight: 500; }
        .booking-number { font-size: 1.5rem; font-weight: bold; color: #4f46e5; letter-spacing: 2px; margin: 1rem 0; }
        .divider { border-top: 1px dashed #d1d5db; margin: 1.5rem 0; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; text-decoration: none; margin: 0.5rem; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>TicketGo</h1>
    </nav>

    <div class="container">
        <div class="success-box">
            <div class="success-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1 class="success-title">예매가 완료되었습니다!</h1>
            <p class="success-subtitle">결제가 정상적으로 처리되었습니다.</p>

            <p style="color: #6b7280;">예약번호</p>
            <p class="booking-number" th:text="${booking.bookingNumber}">ABC-123-DEF</p>

            <div class="ticket-info">
                <div class="info-row">
                    <span class="info-label">이벤트</span>
                    <span class="info-value" th:text="${event.name}">이벤트명</span>
                </div>
                <div class="info-row">
                    <span class="info-label">일시</span>
                    <span class="info-value" th:text="${#temporals.format(event.startDateTime, 'yyyy-MM-dd HH:mm')}">2024-12-31 19:00</span>
                </div>
                <div class="info-row">
                    <span class="info-label">장소</span>
                    <span class="info-value" th:text="${event.venue}">장소</span>
                </div>
                <div class="info-row">
                    <span class="info-label">티켓 수량</span>
                    <span class="info-value" th:text="${booking.ticketCount} + '매'">2매</span>
                </div>
                <div class="divider"></div>
                <div class="info-row">
                    <span class="info-label">결제 금액</span>
                    <span class="info-value" style="color: #4f46e5; font-size: 1.25rem;" th:text="${#numbers.formatInteger(booking.totalAmount, 0, 'COMMA')} + '원'">100,000원</span>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <a href="/my-bookings" class="btn btn-primary">내 예매 확인</a>
                <a href="/" class="btn btn-secondary">홈으로</a>
            </div>
        </div>
    </div>
</body>
</html>
