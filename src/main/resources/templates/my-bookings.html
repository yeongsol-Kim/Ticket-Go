<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketGo - 내 예매</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 1.5rem; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .page-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .booking-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1rem; overflow: hidden; }
        .booking-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
        .booking-number { font-weight: 500; color: #374151; }
        .booking-status { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; }
        .status-confirmed { background: #d1fae5; color: #059669; }
        .status-reserved { background: #fef3c7; color: #d97706; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }
        .status-expired { background: #e5e7eb; color: #6b7280; }
        .booking-body { padding: 1.5rem; display: flex; gap: 1.5rem; }
        .event-thumb { width: 100px; height: 100px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; flex-shrink: 0; }
        .booking-info { flex: 1; }
        .booking-info h3 { margin-bottom: 0.5rem; }
        .booking-info p { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .booking-price { text-align: right; }
        .booking-price .price { font-size: 1.25rem; font-weight: bold; color: #4f46e5; }
        .booking-price .tickets { color: #6b7280; font-size: 0.9rem; }
        .empty-state { text-align: center; padding: 4rem 2rem; background: white; border-radius: 12px; }
        .empty-state p { color: #6b7280; margin-bottom: 1rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; }
        .btn-primary { background: #4f46e5; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>TicketGo</h1>
        <div>
            <a href="/">이벤트</a>
            <a href="/logout">로그아웃</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="page-title">내 예매 내역</h2>

        <div th:if="${bookings.isEmpty()}" class="empty-state">
            <p>예매 내역이 없습니다.</p>
            <a href="/" class="btn btn-primary">이벤트 둘러보기</a>
        </div>

        <div th:each="item : ${bookings}" class="booking-card">
            <div class="booking-header">
                <span class="booking-number" th:text="'예약번호: ' + ${item.booking.bookingNumber}">예약번호: ABC-123</span>
                <span class="booking-status"
                      th:classappend="${item.booking.status.name() == 'CONFIRMED'} ? 'status-confirmed' :
                                     (${item.booking.status.name() == 'RESERVED'} ? 'status-reserved' :
                                     (${item.booking.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-expired'))"
                      th:text="${item.booking.status.name() == 'CONFIRMED'} ? '예매완료' :
                               (${item.booking.status.name() == 'RESERVED'} ? '결제대기' :
                               (${item.booking.status.name() == 'CANCELLED'} ? '취소됨' : '만료됨'))">
                    상태
                </span>
            </div>
            <div class="booking-body">
                <div class="event-thumb">
                    <span th:text="${#strings.substring(item.event.name, 0, 1)}">E</span>
                </div>
                <div class="booking-info">
                    <h3 th:text="${item.event.name}">이벤트명</h3>
                    <p th:text="${#temporals.format(item.event.startDateTime, 'yyyy-MM-dd HH:mm')}">2024-12-31 19:00</p>
                    <p th:text="${item.event.venue}">장소</p>
                </div>
                <div class="booking-price">
                    <p class="price" th:text="${#numbers.formatInteger(item.booking.totalAmount, 0, 'COMMA')} + '원'">100,000원</p>
                    <p class="tickets" th:text="${item.booking.ticketCount} + '매'">2매</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
