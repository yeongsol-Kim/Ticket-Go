<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketGo - 이벤트</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 1.5rem; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .page-title { font-size: 1.75rem; margin-bottom: 1.5rem; }
        .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .event-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; transition: transform 0.2s; }
        .event-card:hover { transform: translateY(-4px); }
        .event-image { height: 200px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; }
        .event-content { padding: 1.5rem; }
        .event-title { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .event-info { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .event-price { font-size: 1.5rem; font-weight: bold; color: #4f46e5; margin: 1rem 0; }
        .event-status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; }
        .status-on-sale { background: #d1fae5; color: #059669; }
        .status-sold-out { background: #fee2e2; color: #dc2626; }
        .btn { display: inline-block; width: 100%; padding: 0.75rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; text-align: center; text-decoration: none; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; }
        .empty-state { text-align: center; padding: 3rem; color: #6b7280; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>TicketGo</h1>
        <div>
            <a th:if="${session.memberId == null}" href="/login">로그인</a>
            <a th:if="${session.memberId == null}" href="/register">회원가입</a>
            <span th:if="${session.memberId != null}" th:text="'안녕하세요, ' + ${session.memberName} + '님'"></span>
            <a th:if="${session.memberId != null}" href="/my-bookings">내 예약</a>
            <a th:if="${session.memberId != null}" href="/logout">로그아웃</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="page-title">판매 중인 이벤트</h2>

        <div th:if="${events.isEmpty()}" class="empty-state">
            <p>현재 판매 중인 이벤트가 없습니다.</p>
        </div>

        <div class="event-grid">
            <div th:each="event : ${events}" class="event-card">
                <div class="event-image">
                    <span th:text="${#strings.substring(event.name, 0, 1)}">E</span>
                </div>
                <div class="event-content">
                    <h3 class="event-title" th:text="${event.name}">이벤트명</h3>
                    <p class="event-info">
                        <span th:text="${event.venue}">장소</span><br>
                        <span th:text="${#temporals.format(event.startDateTime, 'yyyy-MM-dd HH:mm')}">날짜</span>
                    </p>
                    <p class="event-info">
                        잔여: <strong th:text="${event.availableTickets}">0</strong> / <span th:text="${event.totalTickets}">100</span>
                    </p>
                    <p class="event-price" th:text="${#numbers.formatInteger(event.price, 0, 'COMMA')} + '원'">50,000원</p>

                    <span th:if="${event.status.name() == 'ON_SALE'}" class="event-status status-on-sale">판매중</span>
                    <span th:if="${event.status.name() == 'SOLD_OUT'}" class="event-status status-sold-out">매진</span>

                    <div style="margin-top: 1rem;">
                        <a th:if="${event.status.name() == 'ON_SALE'}"
                           th:href="@{/events/{id}/queue(id=${event.id})}"
                           class="btn btn-primary">예매하기</a>
                        <span th:if="${event.status.name() == 'SOLD_OUT'}"
                              class="btn btn-disabled">매진</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
